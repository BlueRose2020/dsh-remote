# The plugin's bundle patch.
#
# `package.json` declares this file as `dsh.bundle.patch`, so it is applied for you:
# install the package (`dsh plugin --profile web add github:BlueRose2020/dsh-remote`,
# or one click in 设置 → 插件市场) and the profile launcher composes the row below —
# there is nothing to copy by hand, and upgrading the package upgrades this file too.
#
# What still *is* manual: the package name has to be listed in the profile's
# `dsh.profile.bundles` (`$DSH_HOME/profiles/web/package.json`), which is what makes
# the launcher load the layer at all. The market does that for you; a bare
# `dsh plugin add` does not.
#
# Copy this row into `$DSH_HOME/profiles/web/cordis.patch.yml` only if you want to
# override the defaults below — that user layer is applied after every bundle layer.

- insert:
    - id: remote-channel
      # The *package* name: the loader resolves it from the profile's node_modules.
      # (`dsh plugin add` puts it there; the market does too.)
      # Installing by path instead — the way to develop against a working copy — then
      # write the entry file instead, because Node's ESM loader does not accept a bare
      # directory URL. A relative path is anchored to the directory holding the patch:
      #   name: ../plugins/dsh-remote/lib/index.js
      name: dsh-remote
      config:
        # Turn the whole plugin on/off without uninstalling it.
        enabled: true
        # Enable one or both transports. `wechat-local` needs the Windows
        # WeChat client plus the Python bridge; `onebot` needs a local
        # NapCatQQ / Lagrange.Core / LLOneBot WebSocket server.
        transports:
          - wechat-local
          # - onebot

        notifyOnError: true
        notifyOnQuestion: true
        notifyOnApproval: true
        notifyOnTurnEnd: false

        remoteControl: true
        # Only messages starting with this prefix are treated as commands.
        # Set to '' to forward every inbound message.
        commandPrefix: '#'
        # 'auto' follows the most recently active root session, or pin one
        # exact session id here.
        targetSession: auto

        wechat:
          pythonPath: python
          pollIntervalMs: 5000
          statusIntervalMs: 60000

        # Fill in and enable together with the `onebot` transport above.
        onebot:
          url: ws://127.0.0.1:3001
          accessToken: ''
          # Your own QQ number (private chat) or a group number when
          # `target: group`. Empty means "reply to the last person who spoke".
          ownerId: ''
          target: private
          acceptSelfMessages: true
          # Lock the channel down once you know the ids (see the README).
          privateAllowFrom: []
          # Empty means every group message is ignored.
          groupAllowFrom: []
